name: Timestamp UDF release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  publish-timestamp-udf-jar:
    if: startsWith(github.event.release.tag_name, 'ep-functions-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Derive release version from tag
        id: version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION="${TAG_NAME#ep-functions-v}"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "${TAG_NAME}" ]; then
            echo "Unsupported tag format: ${TAG_NAME}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build and install timestamp UDF module
        working-directory: event-processing/timestamp-udf
        run: mvn --batch-mode clean install

      - name: Build and install deduplication PTF module
        working-directory: event-processing/deduplication-ptf
        run: mvn --batch-mode clean install

      - name: Set combined module version
        working-directory: event-processing/ibm-ep-functions
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Build combined jar
        working-directory: event-processing/ibm-ep-functions
        run: mvn --batch-mode clean verify

      - name: Upload jar asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            event-processing/ibm-ep-functions/target/ibm-ep-functions.jar \
            --clobber
